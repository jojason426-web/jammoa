name: Crawl Latest Jammoa Posts

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Normalize Cloudflare credentials
        shell: bash
        run: |
          {
            printf 'CLOUDFLARE_API_TOKEN<<EOF\n'
            printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '[:space:]'
            printf '\nEOF\n'
            printf 'CLOUDFLARE_ACCOUNT_ID='
            printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]'
            printf '\n'
          } >> "$GITHUB_ENV"
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run crawl:latest
        env:
          JAMMOA_CRAWL_LIMIT: 12
